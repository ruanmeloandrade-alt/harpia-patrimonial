<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11261f" />
  <meta name="description" content="Hárpia Patrimonial & Co." />
  <title>Hárpia Patrimonial & Co.</title>
  <style>
    :root{--forest:#1f3a31;--forest-deep:#11261f;--gold:#d9c39c;--paper:#f4f0e8;--white:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--paper);color:#17221e}
    a{text-decoration:none;color:inherit}
    header{position:sticky;top:0;z-index:50;min-height:78px;padding:14px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:28px;background:rgba(17,38,31,.96);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);color:#fff}
    .brand{display:inline-flex;align-items:center;gap:11px;min-width:220px}
    .brand-mark{width:39px;height:39px;display:grid;place-items:center;border:1px solid rgba(217,195,156,.6);border-radius:50%;color:var(--gold);font-family:Georgia,serif;font-size:1.25rem}
    .brand-copy{display:grid;line-height:1.05}
    .brand-copy strong{font-size:.92rem;letter-spacing:.18em}
    .brand-copy small{margin-top:4px;font-size:.54rem;letter-spacing:.14em;color:rgba(255,255,255,.62)}
    nav{display:flex;align-items:center;justify-content:flex-end;flex:1;gap:24px;flex-wrap:wrap}
    nav a{font-size:.8rem;color:rgba(255,255,255,.78);transition:color .18s ease}
    nav a:hover{color:#fff}
    main{min-height:calc(100vh - 78px)}
    .chat{position:fixed;right:24px;bottom:24px;z-index:70;min-height:52px;padding:0 22px;display:inline-flex;align-items:center;border:1px solid rgba(217,195,156,.55);border-radius:999px;background:var(--forest-deep);color:#fff;font-size:.84rem;font-weight:800;box-shadow:0 18px 50px rgba(17,38,31,.24);cursor:pointer}
    .chat:hover{background:var(--forest);transform:translateY(-2px)}
    @media(max-width:980px){header{align-items:flex-start;flex-direction:column}.brand{min-width:0}nav{justify-content:flex-start;width:100%;gap:16px}.chat{right:14px;bottom:14px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Hárpia Patrimonial - início">
      <span class="brand-mark">H</span>
      <span class="brand-copy"><strong>HÁRPIA</strong><small>PATRIMONIAL & CO.</small></span>
    </a>
    <nav aria-label="Navegação principal">
      <a href="/sobre/">Sobre</a>
      <a href="/investimentos/">Investimentos</a>
      <a href="/leiloes/">Leilões</a>
      <a href="/assessoria-juridica/">Assessoria Jurídica</a>
      <a href="/arquitetura/">Arquitetura</a>
      <a href="/sistema/">Área Interna</a>
    </nav>
  </header>
  <main aria-label="Página inicial da Hárpia Patrimonial"></main>
  <button class="chat" type="button" onclick="window.dispatchEvent(new CustomEvent('harpia:open-chat'))">Ser atendido agora!</button>
</body>
</html>
