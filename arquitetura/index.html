<script id="harpia-public-nav-order-20261016">
(function(){
  function apply(){
    const nav=document.querySelector('.public-nav');
    if(!nav) return false;
    const desired=[
      ['/leiloes','Leilões',1],
      ['/investimentos','Investimentos',1],
      ['/assessoria-juridica','Assessoria Jurídica',1],
      ['/arquitetura','Arquitetura',1],
      ['/vender','Anunciar Imóvel',1],
      ['/sobre','Sobre',1],
      ['/imoveis','Empreendimentos',1],
      ['/cliente/','Login',0]
    ];
    if(nav.dataset.harpiaMenu==='20261016' && nav.children.length===desired.length) return true;
    nav.innerHTML=desired.map(([href,label,spa])=>'<a href="'+href+'"'+(spa?' data-harpia-spa="1"':'')+'>'+label+'</a>').join('');
    nav.dataset.harpiaMenu='20261016';
    nav.querySelectorAll('[data-harpia-spa]').forEach(function(link){
      link.addEventListener('click',function(event){
        if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
        event.preventDefault();
        const target=new URL(link.href,location.origin);
        history.pushState({},'',target.pathname+target.search);
        window.dispatchEvent(new CustomEvent('harpia:locationchange'));
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });
    return true;
  }
  function start(){
    if(apply()) return;
    const observer=new MutationObserver(function(){if(apply())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(function(){observer.disconnect()},10000);
  }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',start):start();
})();
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
