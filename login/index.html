<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Hárpia Patrimonial & Co.</title><style>:root{--g:#3c5034;--l:#c3ce94;--b:#161616;--o:#eeeef0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#243222,#3c5034);font-family:Inter,Arial,sans-serif;color:var(--b);display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:var(--o);padding:34px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.logo{display:block;width:270px;max-width:100%;margin:0 auto 26px;filter:none;background:#3c5034;padding:13px 16px;border-radius:10px}h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:0 0 8px}.sub{color:#696d67;font-size:13px;line-height:1.5;margin-bottom:24px}label{display:block;font-size:11px;font-weight:700;margin:14px 0 6px}input{width:100%;height:46px;border:1px solid #cfd2cc;border-radius:10px;padding:0 13px;background:white;font-size:14px}button{width:100%;height:48px;margin-top:20px;border:0;border-radius:10px;background:var(--g);color:white;font-weight:700;cursor:pointer}.err{min-height:22px;margin-top:12px;color:#9b2c2c;font-size:12px}.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#5e655c}.hint{margin-top:24px;padding-top:18px;border-top:1px solid #d7dad4;font-size:11px;color:#686d66;line-height:1.6}.hint b{color:#3c5034}</style></head><body><main class="box"><img class="logo" src="/harpia-logo-white.svg" alt="Hárpia Patrimonial & Co."><h1>Acesso Hárpia</h1><div class="sub">Entre com sua conta para acessar a área correspondente ao seu perfil.</div><form id="f"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><div class="err" id="err"></div></form><a class="back" href="/">← Voltar ao site</a><div class="hint"><b>Acesso seguro:</b> use a conta cadastrada na Hárpia. Funcionários entram na área interna e clientes seguem para a área do cliente.</div></main><script>
const SB_URL='https://desxomqvtjaymwwxivwq.supabase.co';
const SB_KEY='sb_publishable_wWUVxjkMDMXLOrzE0y3Y_w_k9jXf88B';
const form=document.getElementById('f');
const err=document.getElementById('err');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  err.textContent='';
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;
  button.textContent='Entrando...';
  try{
    const auth=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body:JSON.stringify({email,password})
    });
    const authData=await auth.json().catch(()=>({}));
    if(!auth.ok||!authData.access_token) throw new Error(authData?.error_description||authData?.msg||'E-mail ou senha inválidos.');

    const profileResponse=await fetch(SB_URL+'/rest/v1/user_profiles?id=eq.'+encodeURIComponent(authData.user.id)+'&select=id,full_name,account_type,is_active',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+authData.access_token}
    });
    const profiles=await profileResponse.json().catch(()=>[]);
    const profile=Array.isArray(profiles)?profiles[0]:null;
    if(!profile||profile.is_active!==true) throw new Error('Conta sem perfil ativo na Hárpia.');

    const role=profile.account_type==='internal'?'internal':'client';
    const session={
      role,
      email,
      name:profile.full_name||email,
      userId:authData.user.id,
      accessToken:authData.access_token,
      refreshToken:authData.refresh_token,
      expiresAt:Date.now()+Number(authData.expires_in||3600)*1000
    };
    localStorage.setItem('harpia_session',JSON.stringify(session));
    localStorage.setItem('harpia_demo_session',JSON.stringify(session));
    location.href=role==='internal'?'/interno/':'/cliente/';
  }catch(error){
    err.textContent=error instanceof Error?error.message:'Não foi possível entrar.';
  }finally{
    button.disabled=false;
    button.textContent='Entrar';
  }
});
</script></body></html>
