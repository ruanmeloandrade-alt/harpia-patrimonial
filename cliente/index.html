async function refreshSession() {

    cache:'no-store'
  });

    await refreshSession();token=state.session?.access_token;

  }

}

function applyCurationFilter(items){const f=state.curation;return items.filter(item=>{
  if(f.tab==='salvos'&&!isFavorite(item))return false;
  if(f.tab==='investimentos'&&!item.tags.some(t=>/invest/i.test(t)))return false;
  if(f.tab==='leiloes'&&!item.tags.some(t=>/leil/i.test(t)))return false;
  if(f.location&&item.location!==f.location&&item.city!==f.location)return false;
  if(f.type&&item.type!==f.type)return false;
  if(f.range){const [min,max]=f.range.split('-').map(Number);if(item.price==null)return false;if(min&&item.price<min*1e6)return false;if(max&&item.price>max*1e6)return false;}
  return true;
})}
function renderCuration(){
  const items=applyCurationFilter(state.catalog);const locations=[...new Set(state.catalog.flatMap(i=>[i.city,i.location]).filter(Boolean))];const types=[...new Set(state.catalog.map(i=>i.type).filter(Boolean))];
  sessionStorage.setItem(FILTER_KEY,JSON.stringify(state.curation));
  const cards=items.length?items.map(item=>{const cover=item.media.find(m=>m.type==='image');const curated=isCurated(item);return `<article class="curation-card ${curated?'curation-personal':''}"><div class="curation-photo">${cover?`<img src="${esc(cover.url)}" alt="${esc(item.title)}">`:'<div class="portal-empty">Sem imagem publicada.</div>'}<span class="curation-badge">${curated?'Selecionado para você':'Oportunidade'}</span></div><div class="curation-body"><div class="curation-place">${esc([item.location,item.city].filter(Boolean).join(' · '))}</div><h3>${esc(item.title)}</h3><div class="curation-meta">${esc([item.area?item.area+' m²':'',item.suites?item.suites+' suíte'+(item.suites>1?'s':''):'',item.parking?item.parking+' vaga'+(item.parking>1?'s':''):''].filter(Boolean).join(' · '))}</div><div class="curation-price"><strong>${money(item.price)}</strong><button class="portal-link" data-property="${esc(item.code||item.id)}">Ver detalhes</button></div></div></article>`}).join(''):'<div class="portal-empty" style="grid-column:1/-1"><strong>Nenhuma oportunidade disponível nesta seleção.</strong>Os filtros e abas exibem somente registros reais publicados ou salvos.</div>';
  const body=`<section class="portal-head"><p class="portal-eyebrow">Seu universo de oportunidades</p><h1 class="portal-title">Imóveis vistos com olhar patrimonial.</h1><p class="portal-subtitle">Pesquise, compare e solicite uma avaliação. A seleção personalizada é identificada quando disponibilizada pela equipe.</p><div class="portal-tabs">${[['imoveis','Imóveis'],['investimentos','Investimentos'],['leiloes','Leilões'],['salvos','Salvos']].map(([k,l])=>`<button class="portal-tab ${state.curation.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</div></section>
  <div class="curation-filters"><div class="filter-field"><label>Localização</label><select id="curation-location"><option value="">Todas</option>${locations.map(v=>`<option ${state.curation.location===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="filter-field"><label>Tipo de imóvel</label><select id="curation-type"><option value="">Todos</option>${types.map(v=>`<option ${state.curation.type===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="filter-field"><label>Faixa de investimento</label><select id="curation-range"><option value="">Todas as faixas</option><option value="1-3" ${state.curation.range==='1-3'?'selected':''}>R$ 1 mi até R$ 3 mi</option><option value="3-5" ${state.curation.range==='3-5'?'selected':''}>R$ 3 mi até R$ 5 mi</option><option value="5-10" ${state.curation.range==='5-10'?'selected':''}>R$ 5 mi até R$ 10 mi</option><option value="10-20" ${state.curation.range==='10-20'?'selected':''}>R$ 10 mi até R$ 20 mi</option></select></div><button class="portal-btn" id="apply-curation">Pesquisar oportunidades <span class="portal-arrow">→</span></button></div>
  <div class="curation-toolbar"><span class="portal-section-label">Oportunidades disponíveis</span><span style="font-size:8px;color:var(--muted)">${items.length} ${items.length===1?'resultado':'resultados'}</span></div><div class="curation-cards">${cards}</div>`;
  commonChrome('curadoria','Minha curadoria',body,'02 / 10');
  root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.curation.tab=b.dataset.tab;renderCuration()}));
  root.querySelector('#apply-curation').addEventListener('click',()=>{state.curation.location=root.querySelector('#curation-location').value;state.curation.type=root.querySelector('#curation-type').value;state.curation.range=root.querySelector('#curation-range').value;renderCuration()});
  root.querySelectorAll('[data-property]').forEach(b=>b.addEventListener('click',()=>navigate('oportunidade',{codigo:b.dataset.property})));
}
function renderProperty(ref){
  const item=propertyByRef(ref);if(!item){commonChrome('curadoria','Detalhe da oportunidade','<div class="portal-empty"><strong>Oportunidade não encontrada.</strong>Volte à curadoria e selecione um imóvel publicado.</div>','03 / 10');return}

async function uploadDocument(file,requestId,button,feedback){if(!file)return;if(state.qaMode){feedback.textContent='Conta de teste: envio privado desativado para não gravar dados reais.';button.disabled=false;return;}if(file.size>20*1024*1024){feedback.textContent='Arquivo acima do limite de 20 MB.';return}button.disabled=true;feedback.textContent='Enviando de forma privada…';try{const path=`${state.user.id}/${Date.now()}-${uuid()}-${safeFileName(file.name)}`;const upload=await authedFetch(`/storage/v1/object/client-documents/${path}`,{method:'POST',body:file,headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'}});if(!upload.ok)throw new Error(await parseError(upload));const payload={client_id:state.user.id,storage_path:path,file_name:file.name,mime_type:file.type||null,size_bytes:file.size,status:'received'};let response;if(requestId){response=await authedFetch(`/rest/v1/client_documents?id=eq.${encodeURIComponent(requestId)}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)})}else{payload.request_label='Documento enviado';response=await authedFetch('/rest/v1/client_documents',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)})}if(!response.ok)throw new Error(await parseError(response));await loadPortalData();toast('Documento enviado com segurança.');renderDocuments()}catch(error){feedback.textContent=error.message||'Não foi possível enviar o documento.';button.disabled=false}}

  else if(step===2){const types=['Apartamento','Casa','Cobertura','Lançamento'];const neighborhoods=['Barra da Tijuca','Botafogo','Ipanema','Leblon','Recreio dos Bandeirantes'];content=`<span class="portal-section-label">Etapa 02 / 03</span><h2>Quais preferências devem orientar a curadoria?</h2><p class="portal-subtitle">Escolha somente o que faz sentido agora. Tudo poderá ser ajustado depois.</p><div class="onboard-options"><div class="filter-field"><label>Tipos de imóvel</label><div style="display:flex;flex-wrap:wrap;gap:7px">${types.map(v=>`<button type="button" class="portal-tab ${state.onboarding.propertyTypes.includes(v)?'active':''}" data-type-choice="${v}">${v}</button>`).join('')}</div></div><div class="filter-field"><label>Bairros de interesse</label><div style="display:flex;flex-wrap:wrap;gap:7px">${neighborhoods.map(v=>`<button type="button" class="portal-tab ${state.onboarding.neighborhoods.includes(v)?'active':''}" data-neighborhood-choice="${v}">${v}</button>`).join('')}</div></div><div class="filter-field"><label>Faixa de investimento</label><select id="onboard-range"><option value="">Ainda não definida</option>${['Até R$ 3 mi','R$ 3 mi a R$ 5 mi','R$ 5 mi a R$ 10 mi','R$ 10 mi a R$ 20 mi','Acima de R$ 20 mi'].map(v=>`<option ${state.onboarding.investmentRange===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`}
  else{content=`<span class="portal-section-label">Etapa 03 / 03</span><h2>Preferências registradas.</h2><p class="portal-subtitle">Seu espaço passa a organizar oportunidades e atendimento a partir das informações que você escolheu compartilhar.</p><div class="onboard-options"><div class="onboard-option active"><span class="onboard-radio">✓</span><span><strong>${esc(state.onboarding.objective||'Objetivo não informado')}</strong><small>${esc(state.onboarding.neighborhoods.join(', ')||'Bairros podem ser definidos depois')}</small></span></div></div>`}
  root.innerHTML=`<div class="portal-onboarding"><aside class="onboard-visual"><img class="onboard-logo" src="/assets/brand/harpia-logo-horizontal-white-cropped.png" alt="Hárpia Patrimonial & Co."><div class="onboard-copy"><p class="portal-eyebrow">Boas-vindas ao espaço privado</p><h2>Uma experiência<br>feita para o seu<br>momento patrimonial.</h2><p>Conte o essencial. A Hárpia utiliza suas preferências para orientar as próximas conversas e oportunidades.</p></div><div class="onboard-tradition">Tradição desde 1986</div></aside><main class="onboard-main"><p class="portal-eyebrow">Primeiro acesso</p><h1>Vamos conhecer suas prioridades.</h1><p class="portal-subtitle">Um início objetivo, sem formulários intermináveis.</p><div class="onboard-steps">${stepLabels.map(([label,n],i)=>`${i?'<span class="onboard-divider"></span>':''}<span class="onboard-step ${step===n?'active':step>n?'done':''}"><i>${String(n).padStart(2,'0')}</i><span>${label}</span></span>`).join('')}</div><section class="onboard-card">${content}<div class="onboard-actions"><span>${step===1?'Leva poucos minutos.':step===2?'Preferências podem ser alteradas depois.':'Tudo pronto para continuar.'}</span><div style="display:flex;gap:8px">${step>1?'<button class="portal-btn portal-btn--ghost" id="onboard-back">Voltar</button>':''}<button class="portal-btn" id="onboard-next">${step===3?'Entrar no meu espaço':'Continuar'} <span>→</span></button></div></div></section><footer class="onboard-footer"><span>Espaço privado Hárpia</span><span>09 / 10</span></footer></main></div>`;
  root.querySelectorAll('[data-objective]').forEach(b=>b.addEventListener('click',()=>{state.onboarding.objective=b.dataset.objective;renderOnboarding()}));
  root.querySelectorAll('[data-type-choice]').forEach(b=>b.addEventListener('click',()=>{toggleChoice(state.onboarding.propertyTypes,b.dataset.typeChoice);renderOnboarding()}));
  root.querySelectorAll('[data-neighborhood-choice]').forEach(b=>b.addEventListener('click',()=>{toggleChoice(state.onboarding.neighborhoods,b.dataset.neighborhoodChoice);renderOnboarding()}));
  root.querySelector('#onboard-range')?.addEventListener('change',e=>state.onboarding.investmentRange=e.target.value);
  root.querySelector('#onboard-back')?.addEventListener('click',()=>{state.onboarding.step=Math.max(1,step-1);renderOnboarding()});
  root.querySelector('#onboard-next').addEventListener('click',()=>void nextOnboarding(step));
}
function toggleChoice(list,value){const i=list.indexOf(value);if(i>=0)list.splice(i,1);else list.push(value)}
async function nextOnboarding(step){if(step===1&&!state.onboarding.objective){toast('Escolha o objetivo que melhor representa seu momento.','error');return}if(step<3){state.onboarding.step=step+1;renderOnboarding();return}if(state.qaMode){state.preferences={...(state.preferences||{}),objective:state.onboarding.objective||null,property_types:[...state.onboarding.propertyTypes],neighborhoods:[...state.onboarding.neighborhoods],investment_range:state.onboarding.investmentRange||null,city:state.onboarding.city||null,onboarding_completed_at:new Date().toISOString()};state.portal.onboardingRequired=false;navigate('overview');return;}try{const body={client_id:state.user.id,objective:state.onboarding.objective||null,property_types:state.onboarding.propertyTypes,neighborhoods:state.onboarding.neighborhoods,investment_range:state.onboarding.investmentRange||null,city:state.onboarding.city||null,onboarding_completed_at:new Date().toISOString()};const response=await authedFetch('/rest/v1/client_portal_preferences?on_conflict=client_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!response.ok)throw new Error(await parseError(response));await loadPortalData();state.portal.onboardingRequired=false;navigate('overview')}catch(error){toast(error.message||'Não foi possível concluir o primeiro acesso.','error')}}

function renderLogin(error=''){
  document.title='Acesso reservado | Hárpia Patrimonial & Co.';
  root.innerHTML=`<div class="portal-login"><aside class="login-visual"><img class="login-logo" src="/assets/brand/harpia-logo-horizontal-white-cropped.png" alt="Hárpia Patrimonial & Co."><div class="login-visual-copy"><p class="portal-eyebrow">Patrimônio acompanhado com inteligência</p><h2>O cuidado continua<br>também depois da visita.</h2><p>Seu ambiente reservado para oportunidades, documentos e acompanhamento com a Hárpia.</p></div><div class="login-tradition">Hárpia Patrimonial & Co. &nbsp;•&nbsp; Tradição familiar desde 1986</div></aside><main class="login-main"><p class="portal-eyebrow">Acesso reservado</p><h1 id="login-heading">Bem-vindo ao seu espaço.</h1><p class="portal-subtitle" id="login-subtitle">Entre com suas credenciais para consultar as informações do seu atendimento.</p><section class="login-card"><div class="login-card-title" id="login-card-title">Entre na sua conta</div><form id="login-form"><label class="login-field"><span>E-mail</span><input name="email" type="email" placeholder="seuemail@dominio.com" autocomplete="email" required></label><label class="login-field"><span>Senha</span><span class="login-password"><input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required><button class="password-toggle" type="button" data-toggle="login-password" aria-label="Mostrar senha">${icon('shield')}</button></span></label><div class="login-tools"><button type="button" id="forgot-password">Esqueceu a senha?</button></div><button class="portal-btn" type="submit">Acessar meu espaço <span>→</span></button><p class="login-feedback" id="login-feedback">${esc(error)}</p><p class="login-signup-note">Primeiro acesso? <button type="button" id="open-signup">Criar meu acesso</button></p></form><form id="signup-form" hidden><label class="login-field"><span>Nome completo</span><input name="name" type="text" autocomplete="name" required></label><label class="login-field"><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label><label class="login-field"><span>WhatsApp</span><input name="whatsapp" type="tel" autocomplete="tel" required></label><label class="login-field"><span>Senha</span><span class="login-password"><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-toggle="signup-password" aria-label="Mostrar senha">${icon('shield')}</button></span></label><button class="portal-btn" type="submit">Criar meu acesso <span>→</span></button><p class="login-feedback" id="signup-feedback"></p><p class="login-signup-note">Já possui acesso? <button type="button" id="open-login">Voltar para o login</button></p></form></section><p class="login-access-note">O acesso é individual e reservado a clientes autorizados.</p><div class="login-support">Precisa de ajuda para acessar?<br><a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Olá, preciso de ajuda para acessar meu espaço privado na Hárpia. [ORIGEM:portal-cliente|ACAO:ajuda-acesso]')}" target="_blank" rel="noopener">Falar com o suporte da Hárpia →</a></div><span class="login-page-number">10 / 10</span></main></div>`;
  root.querySelector('#login-form').addEventListener('submit',e=>void handleLogin(e));root.querySelector('#signup-form').addEventListener('submit',e=>void handleSignup(e));root.querySelector('#open-signup').addEventListener('click',()=>setLoginMode('signup'));root.querySelector('#open-login').addEventListener('click',()=>setLoginMode('login'));root.querySelector('#forgot-password').addEventListener('click',()=>void forgotPassword());root.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const input=root.querySelector('#'+b.dataset.toggle);input.type=input.type==='password'?'text':'password'}));
}
function setLoginMode(mode){const signupMode=mode==='signup';root.querySelector('#login-form').hidden=signupMode;root.querySelector('#signup-form').hidden=!signupMode;root.querySelector('#login-heading').textContent=signupMode?'Crie seu acesso.':'Bem-vindo ao seu espaço.';root.querySelector('#login-subtitle').textContent=signupMode?'Cadastre seus dados para iniciar seu relacionamento privado com a Hárpia.':'Entre com suas credenciais para consultar as informações do seu atendimento.';root.querySelector('#login-card-title').textContent=signupMode?'Primeiro acesso':'Entre na sua conta'}
async function handleLogin(event){event.preventDefault();const form=new FormData(event.currentTarget),feedback=root.querySelector('#login-feedback'),button=event.currentTarget.querySelector('button[type="submit"]');feedback.textContent='';button.disabled=true;button.textContent='Acessando…';try{const email=String(form.get('email')||'').trim().toLowerCase(),password=String(form.get('password')||'');if(email===QA_EMAIL&&await sha256(password)===QA_PASSWORD_HASH){activateQaSession();await loadCatalog();navigate('overview');return;}await login(email,password);await Promise.all([loadPortalData(),loadCatalog(),loadFavorites()]);if(state.portal.onboardingRequired)renderOnboarding();else navigate('overview')}catch(error){feedback.textContent=error.message||'Não foi possível entrar.';button.disabled=false;button.innerHTML='Acessar meu espaço <span>→</span>'}}
async function handleSignup(event){event.preventDefault();const form=new FormData(event.currentTarget),feedback=root.querySelector('#signup-feedback'),button=event.currentTarget.querySelector('button[type="submit"]');feedback.textContent='';button.disabled=true;button.textContent='Criando…';try{const result=await signup(String(form.get('name')||''),String(form.get('email')||''),String(form.get('whatsapp')||''),String(form.get('password')||''));if(result.session){await Promise.all([loadPortalData(),loadCatalog(),loadFavorites()]);renderOnboarding()}else{feedback.textContent='Conta criada. Confirme seu e-mail para concluir o acesso.';button.disabled=false;button.innerHTML='Criar meu acesso <span>→</span>'}}catch(error){feedback.textContent=error.message||'Não foi possível criar o acesso.';button.disabled=false;button.innerHTML='Criar meu acesso <span>→</span>'}}
async function forgotPassword(){const email=root.querySelector('#login-form [name="email"]').value.trim(),feedback=root.querySelector('#login-feedback');if(!email){feedback.textContent='Informe seu e-mail para receber a recuperação.';return}try{await requestReset(email);feedback.textContent='Enviamos as instruções de recuperação para o seu e-mail.'}catch(error){feedback.textContent=error.message||'Não foi possível enviar a recuperação.'}}

void bootstrap();

</script>
