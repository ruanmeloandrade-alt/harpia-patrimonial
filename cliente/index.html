<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Cliente | Hárpia</title><style>:root{--g:#3c5034;--l:#c3ce94;--b:#161616;--o:#eeeef0;--line:#d8ddd4}*{box-sizing:border-box}body{margin:0;background:var(--o);color:var(--b);font-family:Inter,Arial,sans-serif}header{background:#2d3d29;color:white;padding:18px 0}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:230px;max-width:48vw}.out{border:1px solid rgba(255,255,255,.35);background:transparent;color:white;padding:9px 13px;border-radius:8px;cursor:pointer}main{padding:36px 0 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:40px;margin:0}.hero p{color:#6f756d;margin:7px 0 0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#f8f8f6;border:1px solid var(--line);border-radius:15px;padding:22px}.card h2{font-family:Georgia,serif;font-weight:400;margin:0 0 14px;font-size:26px}.empty{padding:34px 12px;border:1px dashed #cfd5cc;border-radius:12px;text-align:center;color:#7b8178;font-size:13px}.profile{display:grid;gap:11px;font-size:13px}.profile div{padding:12px;background:white;border-radius:9px;border:1px solid #e1e4de}.cta{display:inline-block;margin-top:14px;background:var(--g);color:white;padding:11px 14px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:700}@media(max-width:780px){.grid{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:34px}}</style></head><body><header><div class="wrap top"><a href="/"><img class="logo" src="/harpia-logo-white.svg" alt="Hárpia"></a><button class="out" onclick="logout()">Sair</button></div></header><main><div class="wrap"><div class="hero"><div><h1>Área do cliente</h1><p id="welcome">Acompanhe seus interesses e imóveis salvos.</p></div><a class="cta" href="/">Explorar imóveis</a></div><div class="grid"><section class="card"><h2>Favoritos</h2><div class="empty">Você ainda não salvou nenhum imóvel.</div></section><section class="card"><h2>Seu perfil</h2><div class="profile"><div><b>Nome</b><br><span id="name"></span></div><div><b>E-mail</b><br><span id="email"></span></div><div><b>Tipo de conta</b><br>Cliente</div></div></section><section class="card"><h2>Interesses</h2><div class="empty">Nenhum interesse registrado ainda.</div></section><section class="card"><h2>Histórico</h2><div class="empty">Nenhuma interação registrada ainda.</div></section></div></div></main><script>const s=JSON.parse(localStorage.getItem('harpia_demo_session')||'null');if(!s||s.role!=='client')location.href='/login/';document.getElementById('name').textContent=s?.name||'Cliente Teste Hárpia';document.getElementById('email').textContent=s?.email||'';document.getElementById('welcome').textContent='Olá, '+(s?.name||'cliente')+'. Acompanhe seus interesses e imóveis salvos.';function logout(){localStorage.removeItem('harpia_demo_session');location.href='/login/'}</script></body></html>
