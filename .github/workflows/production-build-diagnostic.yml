name: Production build diagnostic

on:
  push:
    branches:
      - fix/inbox-production-current-20260924
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
