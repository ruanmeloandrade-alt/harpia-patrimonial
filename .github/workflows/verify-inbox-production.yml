name: Verify Inbox production commit

on:
  push:
    branches:
      - verify/inbox-production-8da78d9

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
