name: Inbox redesign verification

on:
  push:
    branches:
      - work/inbox-redesign-20260924

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
