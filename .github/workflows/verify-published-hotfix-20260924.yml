name: Verify published hotfix 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-hotfix-20260924.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('interno/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          if not scripts:
              raise SystemExit('no script found')
          Path('/tmp/harpia-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['renderInbox','sbOpenBlockPicker','editCatalog','editProduct','Ctrl']:
              if marker not in html:
                  raise SystemExit('missing marker '+marker)
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/harpia-inline.js
