name: Hotfix published internal UI 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-published-internal-ui-20260924.yml'

permissions:
  contents: write

jobs:
  patch-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Patch only Inbox, SalesBot and catalog/product editing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('interno/index.html')
          html = path.read_text(encoding='utf-8')

          inbox_html = '''<section id="inbox" class="panel"><div class="inbox-pro"><aside id="inboxProfile" class="inbox-profile"></aside><main class="inbox-chat"><header id="inboxChatHead" class="inbox-chat-head"></header><div id="inboxMessages" class="inbox-messages"></div><form class="inbox-composer" onsubmit="inboxSendMessage(event)"><textarea id="inboxComposer" rows="2" placeholder="Digite uma mensagem..."></textarea><button class="btn" type="submit">Enviar</button></form></main><aside class="inbox-conversations"><div class="inbox-conv-head"><div><span>INBOX</span><h2>Conversas</h2></div><input id="inboxSearch" placeholder="Buscar conversa" oninput="renderInbox()"></div><div id="inboxConversationList" class="inbox-conv-list"></div></aside></div></section>'''
          html, count = re.subn(r'<section id="inbox" class="panel">.*?</section>(?=<section id="salesbot")', inbox_html, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Inbox placeholder not found exactly once')

          css = r'''
          /* hotfix scoped: inbox + salesbot + product/catalog editing */
          #inbox.panel.active{padding:0;min-height:calc(100vh - 56px)}
          .inbox-pro{display:grid;grid-template-columns:300px minmax(420px,1fr) 310px;gap:10px;min-height:calc(100vh - 92px)}
          .inbox-profile,.inbox-chat,.inbox-conversations{background:#fff;border:1px solid #dfe4df;border-radius:14px;overflow:hidden;min-width:0}
          .inbox-profile{padding:16px;overflow:auto}.inbox-profile-head{display:flex;gap:11px;align-items:center;padding-bottom:14px;border-bottom:1px solid #edf0ed}.inbox-avatar{width:44px;height:44px;border-radius:13px;background:#29483e;color:#fff;display:grid;place-items:center;font-weight:900}.inbox-profile-head h3{margin:0;font-size:16px}.inbox-profile-head p{margin:3px 0 0;color:#7c847d;font-size:10px}.inbox-section{padding:14px 0;border-bottom:1px solid #edf0ed}.inbox-section:last-child{border-bottom:0}.inbox-section h4{margin:0 0 9px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#69746c}.inbox-field{display:grid;gap:5px;margin-bottom:9px}.inbox-field label{font-size:9px;font-weight:800;color:#6d766f}.inbox-field input,.inbox-field select{width:100%;border:1px solid #d7ddd8;border-radius:8px;padding:9px;background:#fff;font:inherit;font-size:10px}.inbox-tags{display:flex;gap:6px;flex-wrap:wrap}.inbox-tag{display:inline-flex;gap:5px;align-items:center;background:#eef3ee;border:1px solid #dbe3dc;color:#405047;padding:5px 8px;border-radius:999px;font-size:9px}.inbox-tag button{border:0;background:transparent;color:#8a4a45;cursor:pointer;padding:0}.inbox-small-btn{border:1px dashed #bdc9bf;background:#f8faf7;color:#46564b;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:800;cursor:pointer}.inbox-chat{display:grid;grid-template-rows:auto 1fr auto}.inbox-chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #edf0ed}.inbox-chat-head strong{display:block;font-size:13px}.inbox-chat-head span{display:block;margin-top:3px;color:#7f8780;font-size:9px}.inbox-quick{display:flex;gap:6px;flex-wrap:wrap}.inbox-quick button{border:1px solid #d6ddd7;background:#fff;color:#405047;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:800;cursor:pointer}.inbox-messages{padding:18px;overflow:auto;background:#f5f7f4;display:flex;flex-direction:column;gap:9px}.inbox-msg{max-width:78%;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #dfe4df;font-size:10px;line-height:1.45;box-shadow:0 3px 10px rgba(30,43,34,.04)}.inbox-msg.out{align-self:flex-end;background:#dfeadf;border-color:#cfddcf}.inbox-msg small{display:block;margin-top:4px;color:#869087;font-size:8px}.inbox-empty{margin:auto;text-align:center;color:#7d867f;font-size:10px}.inbox-composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid #e4e9e3}.inbox-composer textarea{border:1px solid #d6ddd7;border-radius:10px;padding:10px;resize:none;font:inherit}.inbox-conversations{display:grid;grid-template-rows:auto 1fr}.inbox-conv-head{padding:14px;border-bottom:1px solid #edf0ed}.inbox-conv-head span{font-size:8px;font-weight:900;letter-spacing:.16em;color:#748079}.inbox-conv-head h2{margin:3px 0 10px;font-size:20px}.inbox-conv-head input{width:100%;border:1px solid #d7ddd8;border-radius:9px;padding:9px;font:inherit}.inbox-conv-list{overflow:auto;padding:8px;display:grid;align-content:start;gap:6px}.inbox-conv{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:#f7f9f6;border-radius:10px;padding:9px;cursor:pointer}.inbox-conv:hover,.inbox-conv.active{border-color:#b8c7bc;background:#eef4ef}.inbox-conv .avatar{width:36px;height:36px;border-radius:10px;background:#314b40;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.inbox-conv b{display:block;font-size:10px}.inbox-conv small{display:block;color:#7f8780;font-size:8px;margin-top:2px;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inbox-conv time{font-size:8px;color:#8a918b}
          #salesbot .sb-builder-body{display:block;min-height:calc(100vh - 180px)}#salesbot .sb-palette,#salesbot .sb-inspector{display:none!important}#salesbot .sb-canvas-wrap{display:grid;grid-template-rows:auto 1fr;min-height:calc(100vh - 190px)}#salesbot .sb-canvas{min-height:calc(100vh - 230px)}#salesbot .sb-node{width:320px}#salesbot .sb-node-body{font-size:10px}#salesbot .sb-node-inline{padding:9px 10px 10px;border-top:1px solid #edf0ed;display:grid;gap:8px}#salesbot .sb-node-inline label{display:grid;gap:4px;font-size:8px;font-weight:800;color:#68746c}#salesbot .sb-node-inline input,#salesbot .sb-node-inline select,#salesbot .sb-node-inline textarea{width:100%;border:1px solid #d7ddd8;border-radius:8px;padding:8px;background:#fff;font:inherit;font-size:9px}#salesbot .sb-node-inline textarea{min-height:62px;resize:vertical}#salesbot .sb-inline-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}#salesbot .sb-next-step{width:100%;border:1px dashed #aebdb2;background:#f5f8f5;color:#405047;border-radius:8px;padding:8px;font-size:9px;font-weight:900;cursor:pointer}#salesbot .sb-mini-map{position:absolute;left:12px;bottom:12px;width:170px;height:105px;border:1px solid #cad4cc;background:rgba(255,255,255,.94);border-radius:10px;z-index:12;overflow:hidden;box-shadow:0 8px 22px rgba(20,35,24,.12)}#salesbot .sb-mini-map .dot{position:absolute;width:10px;height:7px;border-radius:2px;background:#597468}#salesbot .sb-block-picker{position:fixed;inset:0;background:rgba(20,28,23,.48);z-index:6000;display:grid;place-items:center;padding:20px}#salesbot .sb-block-picker-card{width:min(620px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)}#salesbot .sb-block-picker-card h3{margin:0 0 12px}.sb-block-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sb-block-picker-grid button{border:1px solid #d8dfd9;background:#f7f9f6;border-radius:9px;padding:10px;text-align:left;font-size:10px;font-weight:800;cursor:pointer}#salesbot.sb-fullscreen{position:fixed;inset:0;z-index:5500;background:#eef0ec;padding:12px;overflow:auto}#salesbot.sb-fullscreen .sb-shell{min-height:calc(100vh - 24px)}#salesbot.sb-fullscreen .sb-canvas{min-height:calc(100vh - 115px)}
          .edit-chip{border:1px solid #cdd7cf;background:#fff;color:#405047;border-radius:8px;padding:6px 9px;font-size:9px;font-weight:800;cursor:pointer}
          @media(max-width:1100px){.inbox-pro{grid-template-columns:260px 1fr}.inbox-conversations{grid-column:1/-1;min-height:260px}.inbox-conv-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.inbox-pro{grid-template-columns:1fr}.inbox-profile,.inbox-conversations{min-height:auto}.inbox-chat{min-height:65vh}.sb-block-picker-grid{grid-template-columns:1fr 1fr}}
          '''
          html = html.replace('</style>', css + '</style>', 1)

          js = r'''
          // ---- Inbox hotfix, scoped only to Inbox ----
          const INBOX_UI_KEY='harpia_inbox_ui_v2';let inboxSelectedLeadId='';
          function inboxReadState(){try{const x=JSON.parse(localStorage.getItem(INBOX_UI_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return{}}}
          function inboxWriteState(x){localStorage.setItem(INBOX_UI_KEY,JSON.stringify(x))}
          function inboxLeadMessages(id){const st=inboxReadState();return Array.isArray(st[id])?st[id]:[]}
          function inboxInitials(name){return String(name||'L').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'L'}
          function inboxStageName(lead){const f=crmReadFunnels().find(x=>x.id===lead?.pipelineId),st=f?.stages?.find(x=>x.id===lead?.stageId);return st?.name||'Sem etapa'}
          function inboxSelectLead(id){inboxSelectedLeadId=id;renderInbox()}
          function inboxUpdateStage(value){const leads=crmReadLeads(),i=leads.findIndex(x=>x.id===inboxSelectedLeadId);if(i<0)return;leads[i].stageId=value;leads[i].updatedAt=new Date().toISOString();crmWriteLeads(leads);crmRender();renderInbox()}
          function inboxAddTag(){const tag=prompt('Nova tag');if(!tag?.trim())return;const leads=crmReadLeads(),i=leads.findIndex(x=>x.id===inboxSelectedLeadId);if(i<0)return;leads[i].tags=Array.isArray(leads[i].tags)?leads[i].tags:[];if(!leads[i].tags.some(t=>String(t?.name||t).toLowerCase()===tag.trim().toLowerCase()))leads[i].tags.push(tag.trim());crmWriteLeads(leads);renderInbox()}
          function inboxRemoveTag(index){const leads=crmReadLeads(),i=leads.findIndex(x=>x.id===inboxSelectedLeadId);if(i<0)return;leads[i].tags=Array.isArray(leads[i].tags)?leads[i].tags:[];leads[i].tags.splice(index,1);crmWriteLeads(leads);renderInbox()}
          function inboxAddField(){const key=prompt('Nome do campo personalizado');if(!key?.trim())return;const value=prompt('Valor inicial')||'';const leads=crmReadLeads(),i=leads.findIndex(x=>x.id===inboxSelectedLeadId);if(i<0)return;leads[i].customFields=leads[i].customFields&&typeof leads[i].customFields==='object'?leads[i].customFields:{};leads[i].customFields[key.trim()]=value;crmWriteLeads(leads);renderInbox()}
          function inboxUpdateField(key,value){const leads=crmReadLeads(),i=leads.findIndex(x=>x.id===inboxSelectedLeadId);if(i<0)return;leads[i].customFields=leads[i].customFields&&typeof leads[i].customFields==='object'?leads[i].customFields:{};leads[i].customFields[key]=value;crmWriteLeads(leads)}
          function inboxSendMessage(e){e.preventDefault();const input=document.getElementById('inboxComposer'),text=String(input?.value||'').trim();if(!text||!inboxSelectedLeadId)return;const st=inboxReadState(),list=Array.isArray(st[inboxSelectedLeadId])?st[inboxSelectedLeadId]:[];list.push({id:'msg_'+Date.now(),direction:'out',text,createdAt:new Date().toISOString()});st[inboxSelectedLeadId]=list;inboxWriteState(st);input.value='';renderInbox()}
          function inboxQuick(label){uiToast(label+' acionado nesta conversa.');}
          function renderInbox(){const leads=crmReadLeads(),q=String(document.getElementById('inboxSearch')?.value||'').trim().toLowerCase();if(!inboxSelectedLeadId||!leads.some(x=>x.id===inboxSelectedLeadId))inboxSelectedLeadId=leads[0]?.id||'';const lead=leads.find(x=>x.id===inboxSelectedLeadId);const list=document.getElementById('inboxConversationList'),profile=document.getElementById('inboxProfile'),head=document.getElementById('inboxChatHead'),msgs=document.getElementById('inboxMessages');if(!list||!profile||!head||!msgs)return;const filtered=leads.filter(l=>!q||[l.name,l.whatsapp,l.email,l.source].join(' ').toLowerCase().includes(q));list.innerHTML=filtered.length?filtered.map(l=>{const m=inboxLeadMessages(l.id),last=m[m.length-1];return'<button class="inbox-conv '+(l.id===inboxSelectedLeadId?'active':'')+'" onclick="inboxSelectLead(\''+l.id+'\')"><span class="avatar">'+escapeHtml(inboxInitials(l.name))+'</span><span><b>'+escapeHtml(l.name||'Lead sem nome')+'</b><small>'+escapeHtml(last?.text||l.whatsapp||l.email||inboxStageName(l))+'</small></span><time>'+escapeHtml(last?new Date(last.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')+'</time></button>'}).join(''):'<div class="inbox-empty">Nenhuma conversa encontrada.</div>';if(!lead){profile.innerHTML='<div class="inbox-empty" style="padding:30px">Nenhum lead no CRM.</div>';head.innerHTML='<strong>Inbox</strong>';msgs.innerHTML='<div class="inbox-empty">Crie um lead para iniciar uma conversa.</div>';return}const funnel=crmReadFunnels().find(x=>x.id===lead.pipelineId),tags=Array.isArray(lead.tags)?lead.tags:[],fields=lead.customFields&&typeof lead.customFields==='object'?lead.customFields:{};profile.innerHTML='<div class="inbox-profile-head"><div class="inbox-avatar">'+escapeHtml(inboxInitials(lead.name))+'</div><div><h3>'+escapeHtml(lead.name)+'</h3><p>'+escapeHtml(lead.whatsapp||lead.email||'Contato não informado')+'</p></div></div><div class="inbox-section"><h4>Funil</h4><div class="inbox-field"><label>Etapa do lead</label><select onchange="inboxUpdateStage(this.value)">'+(funnel?.stages||[]).map(st=>'<option value="'+st.id+'" '+(st.id===lead.stageId?'selected':'')+'>'+escapeHtml(st.name)+'</option>').join('')+'</select></div><div class="inbox-field"><label>Responsável</label><input value="'+escapeHtml(lead.owner||'')+'" placeholder="Sem responsável" onchange="(()=>{const a=crmReadLeads(),i=a.findIndex(x=>x.id===inboxSelectedLeadId);if(i>=0){a[i].owner=this.value;crmWriteLeads(a)}})()"></div></div><div class="inbox-section"><h4>Tags</h4><div class="inbox-tags">'+tags.map((t,i)=>'<span class="inbox-tag">'+escapeHtml(t?.name||t)+'<button type="button" onclick="inboxRemoveTag('+i+')">×</button></span>').join('')+'</div><button class="inbox-small-btn" style="margin-top:9px" onclick="inboxAddTag()">+ Tag</button></div><div class="inbox-section"><h4>Campos personalizados</h4>'+Object.entries(fields).map(([k,v])=>'<div class="inbox-field"><label>'+escapeHtml(k)+'</label><input value="'+escapeHtml(v)+'" onchange="inboxUpdateField(\''+String(k).replace(/'/g,"\\'")+'\',this.value)"></div>').join('')+'<button class="inbox-small-btn" onclick="inboxAddField()">+ Campo personalizado</button></div>';head.innerHTML='<div><strong>'+escapeHtml(lead.name)+'</strong><span>'+escapeHtml(inboxStageName(lead))+' · '+escapeHtml(lead.whatsapp||lead.email||'Sem contato')+'</span></div><div class="inbox-quick"><button type="button" onclick="inboxQuick(\'SalesBot\')">SalesBot</button><button type="button" onclick="inboxQuick(\'Agente IA\')">Agente IA</button></div>';const m=inboxLeadMessages(lead.id);msgs.innerHTML=m.length?m.map(x=>'<div class="inbox-msg '+(x.direction==='out'?'out':'')+'">'+escapeHtml(x.text)+'<small>'+new Date(x.createdAt).toLocaleString('pt-BR')+'</small></div>').join(''):'<div class="inbox-empty">Conversa pronta. Envie a primeira mensagem.</div>';msgs.scrollTop=msgs.scrollHeight}
          const __harpiaOpenPanel=window.openPanel;window.openPanel=function(id,label,btn){__harpiaOpenPanel(id,label,btn);if(id==='inbox')setTimeout(renderInbox,0)};

          // ---- Product/catalog editing hotfix ----
          let editingProductId='';
          function editCatalog(id){const cats=readCatalogs(),cat=cats.find(x=>x.id===id);if(!cat)return;const name=prompt('Nome do catálogo',cat.name);if(name===null||!name.trim())return;const description=prompt('Descrição do catálogo',cat.description||'');if(description===null)return;const tags=prompt('Tags separadas por vírgula',(cat.tags||[]).join(', '));if(tags===null)return;cat.name=name.trim();cat.description=description.trim();cat.tags=tags.split(',').map(x=>x.trim()).filter(Boolean);writeCatalogs(cats);renderCatalogs();renderClientProductOptions();uiToast('Catálogo atualizado.');}
          function editProduct(id){const p=readProducts().find(x=>x.id===id);if(!p)return;editingProductId=id;pendingProductImages=[...(p.images||[]).map((url,i)=>({name:'Imagem '+(i+1),url})),...(p.imageKeys||[]).map((localKey,i)=>({name:'Imagem salva '+(i+1),localKey}))];pendingProductVideos=[...(p.videos||[]).map((url,i)=>({name:'Vídeo '+(i+1),url})),...(p.videoKeys||[]).map((localKey,i)=>({name:'Vídeo salvo '+(i+1),localKey}))];document.getElementById('productName').value=p.name||'';document.getElementById('productCode').value=p.code||'';document.getElementById('productPrice').value=p.price||0;document.getElementById('productDiscountType').value=p.discountType||'';document.getElementById('productDiscountValue').value=p.discountValue||0;document.getElementById('productTags').value=(p.tags||[]).join(', ');document.getElementById('productDescription').value=p.description||'';document.getElementById('productVisible').checked=!!p.visibleOnSite;renderPendingProductMedia();toggleProductForm(true);document.getElementById('productName')?.focus();uiToast('Produto aberto para edição.');}
          window.saveProduct=function(e){e.preventDefault();if(activeProductCatalogId!==null&&!readCatalogs().some(x=>x.id===activeProductCatalogId)){alert('Catálogo não encontrado.');return}const name=document.getElementById('productName').value.trim(),code=document.getElementById('productCode').value.trim();if(!name||!code)return;const items=readProducts(),now=new Date().toISOString(),data={catalogId:activeProductCatalogId,name,code,description:document.getElementById('productDescription').value.trim(),images:pendingProductImages.map(x=>x.url).filter(Boolean),imageKeys:pendingProductImages.map(x=>x.localKey).filter(Boolean),videos:pendingProductVideos.map(x=>x.url).filter(Boolean),videoKeys:pendingProductVideos.map(x=>x.localKey).filter(Boolean),visibleOnSite:document.getElementById('productVisible').checked,price:Number(document.getElementById('productPrice').value||0),discountType:document.getElementById('productDiscountType').value,discountValue:Number(document.getElementById('productDiscountValue').value||0),tags:document.getElementById('productTags').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:now};if(editingProductId){const i=items.findIndex(x=>x.id===editingProductId);if(i>=0)items[i]={...items[i],...data}}else{items.unshift({id:uid(),createdAt:now,...data})}writeProducts(items);editingProductId='';e.currentTarget.reset();pendingProductImages=[];pendingProductVideos=[];renderPendingProductMedia();toggleProductForm(false);renderProducts();renderCatalogs();renderClientProductOptions();uiToast('Produto salvo.');};
          const __renderCatalogs=window.renderCatalogs;window.renderCatalogs=function(){__renderCatalogs();const cats=readCatalogs();document.querySelectorAll('#catalogList .catalog-card').forEach((card,i)=>{const cat=cats[i],bar=card.querySelector('.toolbar');if(cat&&bar&&!bar.querySelector('[data-edit-cat]')){const b=document.createElement('button');b.className='edit-chip';b.type='button';b.dataset.editCat='1';b.textContent='Editar';b.onclick=()=>editCatalog(cat.id);bar.insertBefore(b,bar.lastElementChild)}})};
          const __renderProducts=window.renderProducts;window.renderProducts=function(){__renderProducts();if(activeProductCatalogId===undefined)return;const items=readProducts().filter(p=>activeProductCatalogId===null?p.catalogId==null:p.catalogId===activeProductCatalogId);document.querySelectorAll('#productList .product-card').forEach((card,i)=>{const p=items[i],top=card.querySelector('.product-card-top');if(p&&top&&!top.querySelector('[data-edit-product]')){const box=document.createElement('div');box.style.display='flex';box.style.gap='6px';const edit=document.createElement('button');edit.className='edit-chip';edit.type='button';edit.dataset.editProduct='1';edit.textContent='Editar';edit.onclick=()=>editProduct(p.id);const del=top.querySelector('button');if(del){top.removeChild(del);box.append(edit,del);top.appendChild(box)}else{box.appendChild(edit);top.appendChild(box)}}})};
          window.showProductsRoot=(function(orig){return function(){editingProductId='';return orig()}})(window.showProductsRoot);window.openCatalog=(function(orig){return function(id){editingProductId='';return orig(id)}})(window.openCatalog);window.openStandaloneProduct=(function(orig){return function(){editingProductId='';return orig()}})(window.openStandaloneProduct);

          // ---- SalesBot inline builder hotfix ----
          function sbPersistNoRender(bot){sbNormalizeBot(bot);const bots=sbReadBots(),i=bots.findIndex(x=>x.id===bot.id);bot.updatedAt=sbNow();if(i>=0)bots[i]=bot;else bots.unshift(bot);sbWriteBots(bots);const el=document.getElementById('sbSaveState');if(el)el.textContent='Salvo'}
          window.sbUpdateBlockField=function(field,value,rerender=false){const bot=sbGetCurrent(),b=bot?.blocks.find(x=>x.id===sbSelectedBlockId);if(!b||b.kind==='inicio')return;b.data=b.data||{};b.data[field]=value;sbPersistNoRender(bot);if(rerender)sbRenderBuilder()};
          window.sbMessageButtonField=function(id,value){const bot=sbGetCurrent(),b=bot?.blocks.find(x=>x.id===sbSelectedBlockId),x=b?.data?.buttons?.find(y=>y.id===id);if(!x)return;x.label=value;sbPersistNoRender(bot)};
          window.sbDistUpdate=function(id,value){const bot=sbGetCurrent(),b=bot?.blocks.find(x=>x.id===sbSelectedBlockId),o=b?.data?.options?.find(x=>x.id===id);if(!o)return;o.label=value;sbPersistNoRender(bot)};
          window.sbRuleUpdate=function(id,key,value){const bot=sbGetCurrent(),b=bot?.blocks.find(x=>x.id===sbSelectedBlockId),rule=b?.data?.rules?.find(x=>x.id===id);if(!rule)return;rule[key]=value;if(key==='field'){rule.value='';rule.customField=''}sbPersistNoRender(bot);if(key==='field'||key==='operator')sbRenderBuilder()};
          function sbInlineActionFields(d){const type=d.actionType||'add_note';if(type==='link_product'){const cats=readCatalogs(),products=readProducts(),mode=d.productMode||'catalog',catId=d.catalogId||'',available=mode==='standalone'?products.filter(p=>p.catalogId==null):products.filter(p=>p.catalogId===catId);return'<label>Origem do produto<select onchange="sbUpdateBlockField(\'productMode\',this.value,true)"><option value="catalog" '+(mode==='catalog'?'selected':'')+'>Produto de catálogo</option><option value="standalone" '+(mode==='standalone'?'selected':'')+'>Produto avulso</option></select></label>'+(mode==='catalog'?'<label>Catálogo<select onchange="sbUpdateBlockField(\'catalogId\',this.value,true)">'+sbSelectHtml(cats.map(c=>({value:c.id,label:c.name})),catId,'Selecione o catálogo')+'</select></label>':'')+'<label>Produto<select onchange="sbUpdateBlockField(\'productId\',this.value,false)">'+sbSelectHtml(available.map(p=>({value:p.id,label:p.name})),d.productId,'Selecione o produto')+'</select></label>'}return sbActionFields(d)}
          function sbInlineEditor(b,bot){if(b.kind==='inicio')return'<div class="sb-mini-note">Bloco inicial fixo.</div>';const d=b.data||{};let x='';if(b.kind==='mensagem')x='<label>Mensagem<textarea oninput="sbUpdateBlockField(\'text\',this.value,false)">'+escapeHtml(d.text||'')+'</textarea></label><label>Botões</label><div class="sb-choice-list">'+(d.buttons||[]).map(o=>'<div class="sb-choice-row"><input value="'+escapeHtml(o.label||'')+'" oninput="sbMessageButtonField(\''+o.id+'\',this.value)"><button type="button" onclick="sbMessageRemoveButton(\''+o.id+'\')">×</button></div>').join('')+'</div><button class="sb-add-small" type="button" onclick="sbMessageAddButton()">+ Adicionar botão</button>';else if(b.kind==='espera')x='<label>Tipo de pausa<select onchange="sbUpdateBlockField(\'pauseType\',this.value,true)">'+[['timer','Cronômetro'],['customer_reply','Até o cliente responder'],['audio_open','Até o áudio ser aberto'],['audio_close','Até o áudio ser fechado'],['video_open','Até o vídeo ser aberto'],['video_close','Até o vídeo ser fechado'],['during_business','Pausar durante o expediente'],['outside_business','Pausar fora do expediente']].map(a=>'<option value="'+a[0]+'" '+(d.pauseType===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></label>'+(d.pauseType==='timer'?'<label>Duração<input value="'+escapeHtml(d.duration||'5m')+'" oninput="sbUpdateBlockField(\'duration\',this.value,false)"></label>':'');else if(b.kind==='comentario')x='<label>Comentário interno<textarea oninput="sbUpdateBlockField(\'text\',this.value,false)">'+escapeHtml(d.text||'')+'</textarea></label>';else if(b.kind==='reacao')x='<label>Emoji<input value="'+escapeHtml(d.emoji||'👍')+'" maxlength="4" oninput="sbUpdateBlockField(\'emoji\',this.value,false)"></label>';else if(b.kind==='acao')x='<label>Ação<select onchange="sbUpdateBlockField(\'actionType\',this.value,true)">'+SB_ACTIONS.map(a=>'<option value="'+a[0]+'" '+(d.actionType===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></label>'+sbInlineActionFields(d);else if(b.kind==='condicao')x='<label>Combinação<select onchange="sbUpdateBlockField(\'logic\',this.value,true)"><option value="all" '+(d.logic!=='any'?'selected':'')+'>Todas (E)</option><option value="any" '+(d.logic==='any'?'selected':'')+'>Qualquer (OU)</option></select></label>'+(d.rules||[]).map((r,i)=>'<div class="sb-rule"><div class="sb-rule-head"><b>Condição '+(i+1)+'</b><button type="button" onclick="sbRuleRemove(\''+r.id+'\')">Excluir</button></div><div class="sb-rule-grid"><select onchange="sbRuleUpdate(\''+r.id+'\',\'field\',this.value)">'+SB_CONDITION_FIELDS.map(a=>'<option value="'+a.value+'" '+(r.field===a.value?'selected':'')+'>'+a.label+'</option>').join('')+'</select><select onchange="sbRuleUpdate(\''+r.id+'\',\'operator\',this.value)">'+SB_CONDITION_OPERATORS.map(a=>'<option value="'+a.value+'" '+(r.operator===a.value?'selected':'')+'>'+a.label+'</option>').join('')+'</select>'+sbRuleValueControl(r)+'</div></div>').join('')+'<button class="sb-add-small" type="button" onclick="sbRuleAdd()">+ Condição</button>';else if(b.kind==='validacao')x='<label>Validação<select onchange="sbUpdateBlockField(\'validationType\',this.value,true)">'+SB_VALIDATION_TYPES.map(a=>'<option value="'+a[0]+'" '+(d.validationType===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></label>'+(['exact_number','exact_text','regex','length','not_equals','contains','not_contains'].includes(d.validationType)?'<label>Valor esperado<input value="'+escapeHtml(d.value||'')+'" oninput="sbUpdateBlockField(\'value\',this.value,false)"></label>':'')+(d.validationType==='range'?'<div class="sb-inline-row"><label>Mínimo<input type="number" value="'+escapeHtml(d.min||'')+'" oninput="sbUpdateBlockField(\'min\',this.value,false)"></label><label>Máximo<input type="number" value="'+escapeHtml(d.max||'')+'" oninput="sbUpdateBlockField(\'max\',this.value,false)"></label></div>':'');else if(b.kind==='ia')x='<label>Agente IA<select onchange="sbUpdateBlockField(\'agentId\',this.value,false)">'+sbSelectHtml(aiReadAgents().filter(a=>a.status==='Ativo').map(a=>({value:a.id,label:a.name})),d.agentId,'Selecione o agente')+'</select></label><label>Instrução<textarea oninput="sbUpdateBlockField(\'prompt\',this.value,false)">'+escapeHtml(d.prompt||'')+'</textarea></label>';else if(b.kind==='distribuicao')x='<label>Opções do round robin</label><div class="sb-choice-list">'+(d.options||[]).map(o=>'<div class="sb-choice-row"><input value="'+escapeHtml(o.label||'')+'" oninput="sbDistUpdate(\''+o.id+'\',this.value)"><button type="button" onclick="sbDistRemove(\''+o.id+'\')">×</button></div>').join('')+'</div><button class="sb-add-small" type="button" onclick="sbDistAdd()">+ Opção</button>';else if(b.kind==='iniciar-salesbot')x='<label>SalesBot<select onchange="sbUpdateBlockField(\'botId\',this.value,false)">'+sbSelectHtml(sbReadBots().filter(z=>z.id!==bot.id).map(z=>({value:z.id,label:z.name})),d.botId,'Selecione o SalesBot')+'</select></label>';else if(b.kind==='encerrar-bot')x='<div class="sb-mini-note">Encerra o fluxo neste ponto.</div>';return x}
          function sbEnsureBuilderChrome(){const toolbar=document.querySelector('#salesbot .sb-canvas-toolbar');if(toolbar&&!toolbar.querySelector('[data-sb-full]')){const box=document.createElement('div');box.style.display='flex';box.style.gap='8px';box.innerHTML='<button data-sb-full type="button" onclick="sbToggleFullscreen()">Tela cheia</button><button type="button" onclick="sbAutoArrange()">Organizar blocos</button>';toolbar.querySelector('button')?.remove();toolbar.appendChild(box)}const canvas=document.getElementById('sbCanvas');if(canvas&&!canvas.querySelector('#sbMiniMap')){const m=document.createElement('div');m.id='sbMiniMap';m.className='sb-mini-map';canvas.appendChild(m)}}
          function sbRenderMiniMap(){const m=document.getElementById('sbMiniMap'),bot=sbGetCurrent();if(!m||!bot)return;m.innerHTML=(bot.blocks||[]).map(b=>'<i class="dot" style="left:'+Math.min(155,Math.max(2,b.x/10))+'px;top:'+Math.min(92,Math.max(2,b.y/10))+'px"></i>').join('')}
          window.sbRenderInspector=function(){sbRenderMiniMap()};
          window.sbRenderBuilder=function(){const bot=sbGetCurrent(),nodes=document.getElementById('sbNodes'),empty=document.getElementById('sbCanvasEmpty');if(!bot||!nodes)return;sbEnsureBuilderChrome();empty.style.display=bot.blocks.length>1?'none':'grid';empty.innerHTML='<b>Construtor pronto</b><span>Use “Próximo passo” no bloco inicial.</span>';nodes.innerHTML=bot.blocks.map(b=>{const t=SB_TYPES[b.kind]||{label:b.kind,icon:'•'},start=b.kind==='inicio',sel=sbSelectedBlockIds.has(b.id);return'<article id="sbnode_'+b.id+'" class="sb-node '+(start?'sb-start-node ':'')+(sel?'multi-selected ':'')+'" style="left:'+b.x+'px;top:'+b.y+'px" onclick="event.stopPropagation();sbSelectBlock(event,\''+b.id+'\')"><div class="sb-node-head" onpointerdown="sbStartDrag(event,\''+b.id+'\')"><div class="sb-node-head-left"><span class="sb-node-type">'+t.icon+'</span><b>'+escapeHtml(start?'Iniciar SalesBot':t.label)+'</b></div>'+(start?'<span class="sb-start-lock">PADRÃO</span>':'<button class="sb-node-menu" type="button" onclick="event.stopPropagation();sbDeleteBlock(\''+b.id+'\')">×</button>')+'</div><div class="sb-node-body">'+escapeHtml(sbBlockSummary(b))+'</div>'+(sel?'<div class="sb-node-inline">'+sbInlineEditor(b,bot)+'</div>':'')+'<div class="sb-node-foot">'+sbPortHtml(b)+'</div>'+(!['condicao','validacao','distribuicao','encerrar-bot'].includes(b.kind)?'<div style="padding:0 9px 9px"><button class="sb-next-step" type="button" onclick="event.stopPropagation();sbOpenBlockPicker(\''+b.id+'\')">+ Próximo passo</button></div>':'')+'</article>'}).join('');requestAnimationFrame(()=>{sbRenderConnections();sbRenderMiniMap()})};
          function sbOpenBlockPicker(parentId){document.getElementById('sbBlockPicker')?.remove();const wrap=document.createElement('div');wrap.id='sbBlockPicker';wrap.className='sb-block-picker';const allowed=['mensagem','espera','reacao','comentario','acao','condicao','validacao','ia','distribuicao','iniciar-salesbot','encerrar-bot'];wrap.innerHTML='<div class="sb-block-picker-card"><h3>Escolha o próximo bloco</h3><div class="sb-block-picker-grid">'+allowed.map(k=>'<button type="button" onclick="sbAddNextFromPicker(\''+parentId+'\',\''+k+'\')">'+SB_TYPES[k].icon+' '+SB_TYPES[k].label+'</button>').join('')+'</div><div style="margin-top:12px;text-align:right"><button class="btn alt" type="button" onclick="document.getElementById(\'sbBlockPicker\').remove()">Cancelar</button></div></div>';wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};document.body.appendChild(wrap)}
          function sbAddNextFromPicker(parentId,kind){const bot=sbGetCurrent(),parent=bot?.blocks.find(x=>x.id===parentId);if(!bot||!parent)return;const b={id:sbCreateId('block'),serial:bot.blocks.length,kind,x:parent.x+370,y:parent.y,data:sbDefaultData(kind),nextBlockId:null,falseNextBlockId:null,routes:{}};bot.blocks.push(b);parent.nextBlockId=b.id;sbSelectedBlockId=b.id;sbSelectedBlockIds=new Set([b.id]);sbPersistCurrent(bot);document.getElementById('sbBlockPicker')?.remove();sbRenderBuilder()}
          function sbToggleFullscreen(){document.getElementById('salesbot')?.classList.toggle('sb-fullscreen');setTimeout(()=>{sbRenderConnections();sbRenderMiniMap()},50)}
          document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='d'&&document.getElementById('sbBuilder')?.classList.contains('active')&&sbSelectedBlockIds.size){e.preventDefault();const bot=sbGetCurrent();if(!bot)return;const selected=bot.blocks.filter(b=>sbSelectedBlockIds.has(b.id)&&b.kind!=='inicio');if(!selected.length)return;const map=new Map(),copies=selected.map(b=>{const id=sbCreateId('block');map.set(b.id,id);return{...JSON.parse(JSON.stringify(b)),id,x:b.x+40,y:b.y+40,nextBlockId:null,falseNextBlockId:null,routes:{}}});bot.blocks.push(...copies);sbSelectedBlockIds=new Set(copies.map(x=>x.id));sbSelectedBlockId=copies.length===1?copies[0].id:'';sbPersistCurrent(bot);sbRenderBuilder();uiToast(copies.length+' bloco(s) duplicado(s).')}});
          setTimeout(()=>{renderCatalogs();if(activeProductCatalogId!==undefined)renderProducts();renderInbox();if(sbCurrentBotId)sbRenderBuilder()},50);
          '''
          html = html.replace('</script></body></html>', js + '</script></body></html>', 1)
          path.write_text(html, encoding='utf-8')
          print('patched', path, len(html))
          PY

      - name: Validate patch markers
        run: |
          grep -q 'inbox-pro' interno/index.html
          grep -q 'sbOpenBlockPicker' interno/index.html
          grep -q 'editCatalog' interno/index.html
          grep -q 'editProduct' interno/index.html

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interno/index.html
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'hotfix: restore inbox and finish SalesBot builder controls'
          git push origin HEAD:gh-pages
