<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11261f" />
  <title>Área Interna | Hárpia Patrimonial & Co.</title>
  <style>
    :root{--forest:#1f3a31;--forest-deep:#11261f;--gold:#d9c39c;--paper:#f4f0e8;--ink:#17221e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    header{min-height:78px;padding:14px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:28px;background:var(--forest-deep);color:white}
    .brand{display:inline-flex;align-items:center;gap:11px}.mark{width:39px;height:39px;display:grid;place-items:center;border:1px solid rgba(217,195,156,.6);border-radius:50%;color:var(--gold);font-family:Georgia,serif;font-size:1.25rem}.copy{display:grid;line-height:1.05}.copy strong{font-size:.92rem;letter-spacing:.18em}.copy small{margin-top:4px;font-size:.54rem;letter-spacing:.14em;color:rgba(255,255,255,.62)}
    main{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:32px}.card{width:min(680px,100%);padding:42px;border:1px solid rgba(23,34,30,.14);border-radius:24px;background:#fffdf8;box-shadow:0 24px 80px rgba(17,38,31,.08)}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(2.4rem,6vw,4rem);margin:0 0 18px}.card p{line-height:1.7;color:#68716c}.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;margin-top:10px;border-radius:999px;background:var(--forest);color:white;font-weight:800;font-size:.86rem}
  </style>
</head>
<body>
  <header><a class="brand" href="/"><span class="mark">H</span><span class="copy"><strong>HÁRPIA</strong><small>PATRIMONIAL & CO.</small></span></a></header>
  <main><section class="card"><h1>Área Interna</h1><p>Este endereço será a entrada do cliente para acompanhar processos, trâmites em andamento e histórico. Enquanto a área dedicada é finalizada, o acesso atual continua pela conta do cliente.</p><a class="btn" href="/cliente/">Acessar minha conta</a></section></main>
</body>
</html>
